name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir site
          cp static/index.html site/index.html
          cp -r static/fonts site/static-fonts-tmp && mkdir -p site/static && mv site/static-fonts-tmp site/static/fonts
          cp -r static/vendor site/static/vendor
          cp -r prompts site/prompts
          sed -i "s|__GEMINI_KEY__|${GEMINI_KEY}|" site/index.html
          sed -i "s|__GROQ_KEY__|${GROQ_KEY}|" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
